# vim:ft=kitty
## name: Nord Light (accessible)
## upstream: https://www.nordtheme.com/
## Same palette as the "Nord Light" scheme in ~/.wezterm.lua. Nord accents are
## darkened, same hue, to 4.5:1 on nord6. Black and white are swapped: most
## TUIs assume a dark background and use white for text and black for panels.
## Color 8 is a compromise: 4.0:1 as text, 2.7:1 as a background under color 15.

foreground           #2E3440
background           #ECEFF4
selection_foreground #2E3440
selection_background #D8DEE9

cursor            #2E3440
cursor_text_color #ECEFF4

url_color #357587

active_border_color   #496F95
inactive_border_color #D8DEE9
bell_border_color     #357587
visual_bell_color     none

active_tab_foreground   #ECEFF4
active_tab_background   #496F95
inactive_tab_foreground #2E3440
inactive_tab_background #D8DEE9
tab_bar_background      #E5E9F0
tab_bar_margin_color    none

mark1_foreground #ECEFF4
mark1_background #357587
mark2_foreground #ECEFF4
mark2_background #B54954
mark3_foreground #ECEFF4
mark3_background #8D6618

# black (swapped: light)
color0 #D8DEE9
color8 #687591
# red
color1 #B54954
color9 #B54954
# green
color2  #597442
color10 #597442
# yellow
color3  #8D6618
color11 #8D6618
# blue
color4  #496F95
color12 #496F95
# magenta
color5  #8C5D83
color13 #8C5D83
# cyan
color6  #357587
color14 #457473
# white (swapped: dark)
color7  #4C566A
