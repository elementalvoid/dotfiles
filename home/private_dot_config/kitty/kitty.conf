# vim:fileencoding=utf-8:foldmethod=marker

allow_remote_control yes

# Nord
include current-theme.conf

font_family family="JetBrainsMono Nerd Font Mono"

# Scrolling
scrollback_lines 10000
scrollbar_width 1

# Bell
enable_audio_bell no

# Word selection: characters that are part of a word (double-click selection)
select_by_word_characters "_."

# Copy selection to clipboard automatically (mirrors wezterm CompleteSelection behavior)
copy_on_select clipboard

# Open links with cmd+click (left-button release)
mouse_map cmd+left release grabbed,ungrabbed mouse_handle_click link

# Plain left click: selection + prompt only, NOT link (overrides default)
mouse_map left click ungrabbed mouse_handle_click selection prompt

# Font size
map cmd+equal  change_font_size all +0.5
map cmd+minus  change_font_size all -0.5
map cmd+0      change_font_size all 0

# Shift+Enter → CSI u encoded (for Claude Code multiline input)
map shift+enter send_text all \x1b[13;2u

# Cursor
cursor_blink_interval 0
cursor_shape_unfocused hollow

# disable builtin opacity bindings
map kitty_mod+a send_key kitty_mod+a
