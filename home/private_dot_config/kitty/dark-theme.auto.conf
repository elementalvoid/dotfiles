# vim:ft=kitty
## name: Nord (accessible)
## upstream: https://www.nordtheme.com/
## Same palette as the "Nord" scheme in ~/.wezterm.lua. Text colors are
## lightened, same hue, to 4.5:1 or better on nord0. Color 8 is a compromise:
## 3.9:1 as text, 2.8:1 as a background under color 15.

foreground           #D8DEE9
background           #2E3440
selection_foreground #ECEFF4
selection_background #434C5E

cursor            #D8DEE9
cursor_text_color #2E3440

url_color #88C0D0

active_border_color   #81A1C1
inactive_border_color #4C566A
bell_border_color     #88C0D0
visual_bell_color     none

active_tab_foreground   #3B4252
active_tab_background   #88C0D0
inactive_tab_foreground #E5E9F0
inactive_tab_background #4C566A
tab_bar_background      #3B4252
tab_bar_margin_color    none

mark1_foreground #3B4252
mark1_background #88C0D0
mark2_foreground #3B4252
mark2_background #E0848C
mark3_foreground #3B4252
mark3_background #EBCB8B

# black
color0 #3B4252
color8 #8490A7
# red (nord11, lightened from 3.1:1)
color1 #E0848C
color9 #E0848C
# green
color2  #A3BE8C
color10 #A3BE8C
# yellow
color3  #EBCB8B
color11 #EBCB8B
# blue
color4  #81A1C1
color12 #81A1C1
# magenta (nord15, lightened from 4.4:1)
color5  #B691AF
color13 #B691AF
# cyan
color6  #88C0D0
color14 #8FBCBB
# white
color7  #E5E9F0
color15 #ECEFF4
